# silo-prod credentials, read from Infisical's Production environment through
# infisical-prod-cluster-secret-store (its own read-only service token). No hand-made Secrets.
#
# Infisical Production, path /:
#   silo-prod-root      {"root_user": "...", "root_password": "..."}   Silo administrator
#   silo-prod-ingress   {"access_key": "lcms-ingress", "secret_key": "..."}
#                       The S3 user lego-data-ingress uses. access_key must be "lcms-ingress",
#                       the user created in 03-silo-prod-values.yaml.
#   redpanda-prod-users (already exists, HOMELAB-47) prodproducer_password is used for the
#                       bucket notifications to redpanda-prod.

# silo-prod-root: the chart's existingSecret, which needs the keys rootUser and rootPassword.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-prod-root
  namespace: silo-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-prod-root
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: rootUser
      remoteRef:
        key: silo-prod-root
        property: root_user
    - secretKey: rootPassword
      remoteRef:
        key: silo-prod-root
        property: root_password
---
# silo-prod-ingress-user: the secret key of the S3 user "lcms-ingress". The chart's user job reads
# it, and lego-data-ingress PROD gets the same value through services-prod-external-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-prod-ingress-user
  namespace: silo-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-prod-ingress-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secretKey
      remoteRef:
        key: silo-prod-ingress
        property: secret_key
---
# silo-prod-env: the chart's extraSecret. Its config.env holds the secret-valued server settings.
# Today that is only the Kafka password; the rest of the notification settings are in the values
# file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-prod-env
  namespace: silo-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-prod-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.env: |
          export MINIO_NOTIFY_KAFKA_SASL_PASSWORD_PRIMARY="{{ .prodproducer_password }}"
  data:
    - secretKey: prodproducer_password
      remoteRef:
        key: redpanda-prod-users
        property: prodproducer_password
