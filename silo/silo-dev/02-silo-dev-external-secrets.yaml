# silo-dev credentials (HOMELAB-54). No hand-made Secrets.
#
# silo-dev serves SANDBOX and DEV. Owner decision 2026-11-08: the root credentials live in
# Infisical Development, and each environment has its own S3 user whose key lives in that
# environment, so SANDBOX and DEV never share a key and each user reaches only its own buckets.
#
# Infisical Development, path /:
#   silo-dev-root          {"root_user": "<not minio/admin>", "root_password": "<long random>"}
#   silo-dev-ingress-dev   {"access_key": "lcms-ingress-dev", "secret_key": "<long random>"}
#   redpanda-dev-users     (already exists) devproducer_password is used for the bucket
#                          notifications to redpanda-dev.
# Infisical Sandbox, path /:
#   silo-dev-ingress-sandbox  {"access_key": "lcms-ingress-sandbox", "secret_key": "<long random>"}
#
# When services-dev gets its ExternalSecret (HOMELAB-57), it must copy only *.yml secrets (as
# services-prod does), so silo-dev-root never reaches DEV pods.

# silo-dev-root: the chart's existingSecret (keys rootUser and rootPassword).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-dev-root
  namespace: silo-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-dev-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-dev-root
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: rootUser
      remoteRef:
        key: silo-dev-root
        property: root_user
    - secretKey: rootPassword
      remoteRef:
        key: silo-dev-root
        property: root_password
---
# silo-dev-ingress-sandbox-user: the secret key of S3 user "lcms-ingress-sandbox" (SANDBOX buckets
# only). lego-data-ingress SANDBOX gets the same value through its s3-configuration.yml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-dev-ingress-sandbox-user
  namespace: silo-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-sandbox-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-dev-ingress-sandbox-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secretKey
      remoteRef:
        key: silo-dev-ingress-sandbox
        property: secret_key
---
# silo-dev-ingress-dev-user: the secret key of S3 user "lcms-ingress-dev" (DEV buckets only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-dev-ingress-dev-user
  namespace: silo-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-dev-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-dev-ingress-dev-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secretKey
      remoteRef:
        key: silo-dev-ingress-dev
        property: secret_key
---
# silo-dev-env: the chart's extraSecret. config.env holds the secret-valued server settings: the
# Kafka password of both notification targets (SANDBOX and DEV both publish as devproducer).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-dev-env
  namespace: silo-dev
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-dev-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-dev-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.env: |
          export MINIO_NOTIFY_KAFKA_SASL_PASSWORD_SANDBOX="{{ .devproducer_password }}"
          export MINIO_NOTIFY_KAFKA_SASL_PASSWORD_DEV="{{ .devproducer_password }}"
  data:
    - secretKey: devproducer_password
      remoteRef:
        key: redpanda-dev-users
        property: devproducer_password
