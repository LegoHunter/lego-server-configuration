# Pushover credentials for alert notifications (HOMELAB-6). No hand-made Secret.
#
# Pushover is the channel the owner chose for alerts. Two things send through it: Alertmanager
# (alert rules in prometheus-alerting-values.yaml) and the public IP watch
# (public-ip-watch/). Both read this one Secret, monitoring/alertmanager-pushover.
#
# Infisical Global, path /:
#   pushover   {"app_token": "<Pushover application API token>", "user_key": "<Pushover user key>"}
#
# Global, because the Pushover account belongs to the owner and not to an environment, and the
# monitoring stack serves all environments. The secret's name has no .yml suffix, so the
# services-<env> ExternalSecrets (which copy only *.yml) never hand it to an application pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-global-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app_token
      remoteRef:
        key: pushover
        property: app_token
    - secretKey: user_key
      remoteRef:
        key: pushover
        property: user_key
