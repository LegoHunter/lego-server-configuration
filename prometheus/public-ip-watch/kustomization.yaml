# kubectl apply -k prometheus/public-ip-watch
# The script is turned into the ConfigMap public-ip-watch-script. Every run starts a new pod, so a
# changed script is picked up by the next run after an apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - public-ip-watch.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: public-ip-watch-script
    files:
      - public-ip-watch.sh
