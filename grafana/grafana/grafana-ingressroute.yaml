# Traefik route for https://console.grafana.internal.legohunter.io (certificate: grafana-tls.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # Traefik ignores a route without this class.
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`console.grafana.internal.legohunter.io`)
      kind: Rule
      services:
        - name: grafana
          port: 80
          scheme: http
  tls:
    secretName: grafana-tls
