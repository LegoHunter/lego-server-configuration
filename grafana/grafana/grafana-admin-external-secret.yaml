# Grafana's admin sign-in (HOMELAB-75). No hand-made Secret and no password in git.
#
# Infisical Global, path /:
#   grafana-admin   {"admin_user": "admin", "admin_password": "<the admin password>"}
#
# Global, because Grafana is one installation that serves every environment. The secret's name has
# no .yml suffix, so the services-<env> ExternalSecrets (which copy only *.yml) never hand it to an
# application pod.
#
# Grafana reads this Secret only when it first creates its database (admin.existingSecret in
# grafana-community-values.yaml). After that the password lives in Grafana's database on the persistent
# volume: changing the value in Infisical alone does not change the login. Change the password in
# Grafana and record the new one in Infisical, so a fresh install starts with the right one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-global-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin
        property: admin_password
