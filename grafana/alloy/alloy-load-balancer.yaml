# alloy-loadbalancer.yaml
apiVersion: v1
kind: Service
metadata:
  name: alloy-lb
  namespace: alloy
  annotations:
    metallb.universe.tf/address-pool: first-pool   # or your pool name
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.2.86
  ports:
    - name: http-metrics
      port: 12345
      targetPort: 12345
      protocol: TCP
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
