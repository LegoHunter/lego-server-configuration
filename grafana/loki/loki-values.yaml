deploymentMode: SimpleScalable
loki:
  storage:
    type: s3
    s3:
      #endpoint: http://minio-loki.minio-loki.svc.cluster.local:9000
      #endpoint: https://api.minio.loki.internal.legohunter.io
      #endpoint: http://minio.minio-loki.svc.cluster.local:9000
      endpoint: http://minio.monitoring.svc.cluster.local:80
      access_key_id: tvattima
      secret_access_key: <REDACTED>
      insecure: true
      s3forcepathstyle: true
    bucketNames:
      chunks: loki-logs
      ruler: loki-logs
      admin: loki-logs
  schemaConfig:
    configs:
      - from: "2025-10-27"
        store: boltdb-shipper
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  retention:
    enabled: true
    deletes_enabled: true
    period: 14d
  commonConfig:
    replication_factor: 1
  limits_config:
    max_query_length: 30d
    max_query_parallelism: 4
    allow_structured_metadata: false
    retention_period: 24h
    reject_old_samples: true
    reject_old_samples_max_age: 24h
write:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
read:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
gateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 3100
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
