# Credentials of the MySQL backup (HOMELAB-125). No hand-made Secrets.
#
# Infisical Production, path /:
#   mysql-backup            {"username": "lcms_backup", "password": "<from setup-mysql-backup-account.sh>"}
#   silo-prod-mysql-backup  {"access_key": "lcms-mysql-backup", "secret_key": "<long random>"}
#                           (access_key must be exactly lcms-mysql-backup)
#
# Production, because the backup reads the live PROD databases and writes to the PROD object store.
# Neither name ends in .yml, so services-prod-external-secret (which copies only *.yml) never hands
# them to an application pod.

# The read-only MySQL account the job dumps with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-backup-db
  namespace: mysql-backup
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mysql-backup-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: mysql-backup
        property: username
    - secretKey: password
      remoteRef:
        key: mysql-backup
        property: password
---
# The object store user the job uploads with, for the job itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-backup-s3
  namespace: mysql-backup
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mysql-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: accessKey
      remoteRef:
        key: silo-prod-mysql-backup
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: silo-prod-mysql-backup
        property: secret_key
---
# The same user's secret key, for silo-prod: its chart creates the user lcms-mysql-backup from this
# Secret (users[].existingSecret in ../../silo/silo-prod/03-silo-prod-values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-prod-mysql-backup-user
  namespace: silo-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-prod-mysql-backup-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secretKey
      remoteRef:
        key: silo-prod-mysql-backup
        property: secret_key
