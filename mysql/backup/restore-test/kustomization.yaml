# The restore test (see ../README.md, "Restore test"). A Job cannot be changed once created, so
# delete the last one first:
#   kubectl delete job mysql-restore-test -n mysql-backup --ignore-not-found
#   kubectl apply -k mysql/backup/restore-test
#   kubectl logs -n mysql-backup job/mysql-restore-test -f
# It reads the ConfigMap mysql-backup-settings that ../job creates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mysql-backup
resources:
  - restore-test.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mysql-restore-test-scripts
    files:
      - fetch.sh
      - restore-and-compare.sh
