name: Kubernetes service pipeline

# Shared build / test / deploy pipeline for LCMS Spring Boot services on the homelab k3s cluster
# (HOMELAB-26 E2). Each service repo calls it from a ~30-line .github/workflows/build-test-deploy.yml
# that owns the triggers; see ../../new-service-repo/README.md for the caller template and the
# full service standard.
#
# Environments (the caller passes its own push / pull_request event through):
#   SANDBOX  every push to feature/** runs the tests, builds an image tagged with the pushed commit
#            SHA (labelled quay.expires-after=26w) and deploys it to services-sandbox. Sandbox is
#            the live preview of the feature branch being worked on; the latest push wins.
#   PR       a pull request from feature/* into develop only runs the tests, against the branch
#            merged with the latest develop. No image, no deploy.
#   DEV      merge of feature/* into develop -> services-dev, only if deploy-dev-enabled.
#   PROD     merge of develop into main -> services-prod, only if deploy-prod-enabled.
#
# Deploy gates
#   Callers pass deploy-dev-enabled / deploy-prod-enabled from the DEPLOY_DEV_ENABLED /
#   DEPLOY_PROD_ENABLED Actions variables (repo or LegoHunter org; repo overrides org), true only
#   when the variable is exactly 'true'. A shut gate skips that environment's Maven build, image
#   build/push and deploy (skipped, not failed), and an "<ENV> deploy gate" job posts a notice.
#   SANDBOX is not gated. DEV/PROD images carry no Quay expiry.
#
# Conventions the jobs rely on: the Maven build produces target/*.jar; kubernetes/Containerfile
# builds the image; kubernetes/overlays/<env> renders a Deployment named <app>; the Quay
# repository is quay.io/tvattima/<app>; deploys run on the ARC scale set [arc-runner].
#
# Callers reference this file at @develop, so a change merged here reaches every service on its
# next run. To trial a change, point one service's feature branch at this repo's feature branch.

on:
  workflow_call:
    inputs:
      app:
        description: Service name; also the Quay repository, the Deployment name and the image name in the overlays.
        required: true
        type: string
      java-version:
        description: JDK used by CI. Keep it in step with java.version in pom.xml and the Containerfile base image.
        required: false
        type: string
        default: '21'
      quay-username:
        description: Quay robot account that pushes images (the QUAY_USERNAME variable).
        required: true
        type: string
      deploy-dev-enabled:
        description: DEV gate. Pass the expression vars.DEPLOY_DEV_ENABLED == 'true'.
        required: false
        type: boolean
        default: false
      deploy-prod-enabled:
        description: PROD gate. Pass the expression vars.DEPLOY_PROD_ENABLED == 'true'.
        required: false
        type: boolean
        default: false
    secrets:
      QUAY_TOKEN:
        description: Password / token for quay-username.
        required: true

jobs:
  pr-test:
    name: PR tests
    # Tests the feature branch merged with the latest develop, before it is merged. No deploy.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Run Maven tests
        run: mvn --batch-mode test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox-maven-build:
    name: Sandbox Maven deploy
    # Runs the tests as part of the Maven build. github.sha is the pushed feature-branch commit.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Build and deploy Maven snapshot
        run: mvn --batch-mode --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-app-jar
          path: target/*.jar

  sandbox-container-build:
    name: Sandbox container build and push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: sandbox-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/${{ inputs.app }}
          tags: ${{ github.sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
          # Feature-branch images are throwaway; DEV and PROD images must never expire (HOMELAB-26 B6).
          labels: quay.expires-after=26w
      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/${{ inputs.app }}
          tags: ${{ github.sha }}
          username: ${{ inputs.quay-username }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-sandbox:
    name: Deploy sandbox
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: sandbox-container-build
    # One sandbox deploy at a time; a newer push replaces any deploy still waiting, so the
    # latest push is the one that ends up running.
    concurrency:
      group: deploy-sandbox-${{ inputs.app }}
      cancel-in-progress: false
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Kustomize
        env:
          IMAGE_TAG: ${{ needs.sandbox-container-build.outputs.image-tag }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/overlays/sandbox \
            | sed "s|quay.io/tvattima/$APP:.*|quay.io/tvattima/$APP:$IMAGE_TAG|g" \
            | kubectl apply -n services-sandbox -f -
          kubectl rollout restart deployment "$APP" -n services-sandbox
          kubectl rollout status deployment "$APP" -n services-sandbox --timeout=5m

  dev-deploy-gate:
    name: DEV deploy gate
    # Runs only when the DEV gate is shut, to explain why the DEV jobs were skipped.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && !inputs.deploy-dev-enabled
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report shut gate
        run: |
          msg="DEV deploy gate is shut (the caller's deploy-dev-enabled input is false; set the DEPLOY_DEV_ENABLED variable to 'true' to open it). DEV Maven build, image build/push and deploy were skipped."
          echo "::notice title=DEV deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  dev-maven-build:
    name: DEV Maven deploy
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && inputs.deploy-dev-enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Build and deploy Maven snapshot
        run: mvn --batch-mode --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-app-jar
          path: target/*.jar

  dev-container-build:
    name: DEV container build and push
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && inputs.deploy-dev-enabled
    needs: dev-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dev-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/${{ inputs.app }}
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/${{ inputs.app }}
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          username: ${{ inputs.quay-username }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-dev:
    name: Deploy DEV
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && inputs.deploy-dev-enabled
    needs: dev-container-build
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy via Kustomize
        env:
          IMAGE_TAG: ${{ needs.dev-container-build.outputs.image-tag }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/overlays/dev \
            | sed "s|quay.io/tvattima/$APP:.*|quay.io/tvattima/$APP:$IMAGE_TAG|g" \
            | kubectl apply -n services-dev -f -
          kubectl rollout restart deployment "$APP" -n services-dev
          kubectl rollout status deployment "$APP" -n services-dev --timeout=5m

  prod-deploy-gate:
    name: PROD deploy gate
    # Runs only when the PROD gate is shut, to explain why the PROD jobs were skipped.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && !inputs.deploy-prod-enabled
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report shut gate
        run: |
          msg="PROD deploy gate is shut (the caller's deploy-prod-enabled input is false; set the DEPLOY_PROD_ENABLED variable to 'true' to open it). PROD Maven build, image build/push and deploy were skipped."
          echo "::notice title=PROD deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  prod-maven-build:
    name: PROD Maven deploy
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && inputs.deploy-prod-enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Build and deploy Maven snapshot
        run: mvn --batch-mode --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-app-jar
          path: target/*.jar

  prod-container-build:
    name: PROD container build and push
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && inputs.deploy-prod-enabled
    needs: prod-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: prod-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/${{ inputs.app }}
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/${{ inputs.app }}
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          username: ${{ inputs.quay-username }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-prod:
    name: Deploy PROD
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && inputs.deploy-prod-enabled
    needs: prod-container-build
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy via Kustomize
        env:
          IMAGE_TAG: ${{ needs.prod-container-build.outputs.image-tag }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/overlays/prod \
            | sed "s|quay.io/tvattima/$APP:.*|quay.io/tvattima/$APP:$IMAGE_TAG|g" \
            | kubectl apply -n services-prod -f -
          kubectl rollout restart deployment "$APP" -n services-prod
          kubectl rollout status deployment "$APP" -n services-prod --timeout=5m
