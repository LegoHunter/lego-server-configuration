name: Kubernetes service pipeline

# Shared build / test / deploy pipeline for LCMS Spring Boot services on the homelab k3s cluster
# (HOMELAB-26 E2). Each service repo calls it from a ~30-line .github/workflows/build-test-deploy.yml
# that owns the triggers; see ../../new-service-repo/README.md for the caller template and the
# full service standard.
#
# Environments (the caller passes its own push / pull_request event through):
#   SANDBOX  every push to feature/** runs the tests, builds an image tagged with the pushed commit
#            SHA (labelled quay.expires-after=26w) and deploys it to services-sandbox. Sandbox is
#            the live preview of the feature branch being worked on; the latest push wins.
#   PR       a pull request from feature/* into develop only runs the tests, against the branch
#            merged with the latest develop. No image, no deploy.
#   DEV      merge of feature/* into develop: runs the tests on the merge commit, builds the image
#            ONCE, tags it dev-<merge commit SHA> and deploys it to services-dev. Only if
#            deploy-dev-enabled.
#   PROD     merge of develop into main: NO rebuild (HOMELAB-26 E1, build once, promote by digest).
#            Checks that the main merge commit has exactly the tree of the develop commit that was
#            merged, takes the DEV image built for that develop commit (dev-<develop SHA>), adds the
#            tag prod-<main merge SHA> to the same digest and deploys that digest to services-prod.
#            So PROD runs byte-for-byte the image DEV ran. Fails (does not rebuild) if there is no
#            DEV image for that commit, e.g. the DEV gate was shut when it merged, or develop's head
#            is not a feature/* merge. Only if deploy-prod-enabled.
#
# Docs-only changes (E9): a feature push or PR that only touches *.md, docs/** or LICENSE skips
# the build, tests, image and deploy. Merges into develop/main are never skipped.
# Concurrency (E4): each environment deploys one run at a time per service; the newest waits.
#
# Every deploy ends with a smoke check (E10): /actuator/health/readiness through the service's
# IngressRoute host must report UP within 2 minutes, or the run fails (GitHub then notifies the
# person who pushed or merged).
#
# Every deploy pins the image by digest (quay.io/tvattima/<app>@sha256:...) through a throwaway
# kustomization over kubernetes/overlays/<env>, so what runs is exactly what was pushed or
# promoted, and a changed digest is what rolls the Deployment (no extra rollout restart).
#
# Deploy gates
#   Callers pass deploy-dev-enabled / deploy-prod-enabled from the DEPLOY_DEV_ENABLED /
#   DEPLOY_PROD_ENABLED Actions variables (repo or LegoHunter org; repo overrides org), true only
#   when the variable is exactly 'true'. A shut gate skips that environment's Maven build, image
#   build/push (DEV) or promotion (PROD) and deploy (skipped, not failed), and an "<ENV> deploy gate"
#   job posts a notice. SANDBOX is not gated. DEV/PROD images carry no Quay expiry.
#
# Conventions the jobs rely on: the Maven build produces target/*.jar; kubernetes/Containerfile
# builds the image; kubernetes/overlays/<env> renders a Deployment named <app>; the Quay
# repository is quay.io/tvattima/<app>; deploys run on the ARC scale set [arc-runner].
#
# Callers reference this file at @develop, so a change merged here reaches every service on its
# next run. To trial a change, point one service's feature branch at this repo's feature branch.

on:
  workflow_call:
    inputs:
      app:
        description: Service name; also the Quay repository, the Deployment name and the image name in the overlays.
        required: true
        type: string
      java-version:
        description: JDK used by CI. Keep it in step with java.version in pom.xml and the Containerfile base image.
        required: false
        type: string
        default: '21'
      quay-username:
        description: Quay robot account that pushes images (the QUAY_USERNAME variable).
        required: true
        type: string
      deploy-dev-enabled:
        description: DEV gate. Pass the expression vars.DEPLOY_DEV_ENABLED == 'true'.
        required: false
        type: boolean
        default: false
      deploy-prod-enabled:
        description: PROD gate. Pass the expression vars.DEPLOY_PROD_ENABLED == 'true'.
        required: false
        type: boolean
        default: false
    secrets:
      QUAY_TOKEN:
        description: Password / token for quay-username.
        required: true

jobs:
  changes:
    name: Detect docs-only change
    # E9: a push or PR that only touches documentation (*.md, docs/**, LICENSE) skips the build,
    # tests, image and deploy. Anything else, or anything it cannot determine (a new branch, a
    # failed or truncated compare), runs everything.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
    steps:
      - name: Compare changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$PUSH_BEFORE"; head="$PUSH_AFTER"; fi
          docs_only=false
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No previous commit to compare with (new branch): running everything."
          elif json=$(gh api "repos/$REPO/compare/$base...$head"); then
            count=$(jq '.files | length' <<<"$json")
            if [ "$count" -gt 0 ] && [ "$count" -lt 300 ]; then
              other=$(jq -r '.files[].filename' <<<"$json" | grep -Evc '(\.md$|^docs/|^LICENSE$)' || true)
              if [ "$other" = 0 ]; then docs_only=true; fi
            fi
            echo "Changed files: $count; docs-only: $docs_only"
            jq -r '.files[].filename' <<<"$json" | head -50
          else
            echo "Compare $base...$head failed: running everything."
          fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "::notice title=Docs-only change::Only documentation changed, so build, tests and deploy were skipped."
          fi

  pr-test:
    name: PR tests
    # Tests the feature branch merged with the latest develop, before it is merged. No deploy.
    needs: changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Run Maven tests
        run: mvn --batch-mode test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox-maven-build:
    name: Sandbox Maven build
    # Runs the tests as part of the Maven build. github.sha is the pushed feature-branch commit.
    # Skipped (with the image build and deploy after it) for a docs-only push (E9).
    needs: changes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Maven verify (tests + jar)
        # E9: verify, not deploy - nothing consumes the services' Maven artifacts, so they are no
        # longer published to GitHub Packages. Same tests as before; the jar is still in target/.
        run: mvn --batch-mode --update-snapshots verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-app-jar
          path: target/*.jar

  sandbox-container-build:
    name: Sandbox container build and push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: sandbox-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/${{ inputs.app }}
          tags: ${{ github.sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
          # Feature-branch images are throwaway; DEV and PROD images must never expire (HOMELAB-26 B6).
          labels: quay.expires-after=26w
      - name: Push to Quay
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/${{ inputs.app }}
          tags: ${{ github.sha }}
          username: ${{ inputs.quay-username }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-sandbox:
    name: Deploy sandbox
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: sandbox-container-build
    # One sandbox deploy at a time; a newer push replaces any deploy still waiting, so the
    # latest push is the one that ends up running.
    concurrency:
      group: deploy-sandbox-${{ inputs.app }}
      cancel-in-progress: false
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy by digest
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: sandbox
          IMAGE_DIGEST: ${{ needs.sandbox-container-build.outputs.image-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest '$IMAGE_DIGEST'"; exit 1; }
          mkdir -p kubernetes/.deploy
          printf '%s\n' \
            'apiVersion: kustomize.config.k8s.io/v1beta1' \
            'kind: Kustomization' \
            'resources:' \
            "  - ../overlays/$ENV_NAME" \
            'images:' \
            "  - name: quay.io/tvattima/$APP" \
            "    digest: $IMAGE_DIGEST" > kubernetes/.deploy/kustomization.yaml
          kubectl kustomize kubernetes/.deploy | kubectl apply -n "services-$ENV_NAME" -f -
          kubectl rollout status deployment "$APP" -n "services-$ENV_NAME" --timeout=5m
          echo "Deployed quay.io/tvattima/$APP@$IMAGE_DIGEST to services-$ENV_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke check through the ingress
        # E10: the rollout only proves the pod is ready inside the cluster. This checks the service
        # end to end - DNS, Traefik IngressRoute, TLS certificate, default-headers Middleware - by
        # calling /actuator/health/readiness on the host the IngressRoute actually serves. A failure
        # fails the run, which triggers GitHub's failed-workflow notification to whoever pushed/merged.
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: sandbox
        run: |
          set -euo pipefail
          match=$(kubectl get ingressroute "$APP" -n "services-$ENV_NAME" -o jsonpath='{.spec.routes[0].match}')
          host=$(sed -nE 's/.*Host\(`([^`]+)`\).*/\1/p' <<<"$match")
          if [ -z "$host" ]; then
            echo "::error title=Smoke check failed::No Host(...) in IngressRoute $APP (services-$ENV_NAME): '$match'"
            exit 1
          fi
          url="https://$host/actuator/health/readiness"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o readiness.json -w '%{http_code}' --max-time 10 "$url" 2>curl.err || true)
            if [ "$code" = 200 ] && grep -q '"status":"UP"' readiness.json; then
              echo "Smoke check passed on attempt $attempt: $url -> $code $(head -c 200 readiness.json)"
              echo "Smoke check: $url -> $code $(head -c 200 readiness.json)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: $url -> HTTP $code $(head -c 200 readiness.json 2>/dev/null) $(head -c 200 curl.err)"
            sleep 10
          done
          echo "::error title=Smoke check failed::$url did not report UP within 2 minutes (last HTTP $code). The rollout succeeded inside the cluster, so check DNS, the IngressRoute, the TLS certificate and the default-headers Middleware in services-$ENV_NAME."
          echo "**Smoke check FAILED:** $url (last HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  dev-deploy-gate:
    name: DEV deploy gate
    # Runs only when the DEV gate is shut, to explain why the DEV jobs were skipped.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && !inputs.deploy-dev-enabled
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report shut gate
        run: |
          msg="DEV deploy gate is shut (the caller's deploy-dev-enabled input is false; set the DEPLOY_DEV_ENABLED variable to 'true' to open it). DEV Maven build, image build/push and deploy were skipped, so this develop commit has no DEV image and cannot later be promoted to PROD."
          echo "::notice title=DEV deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  dev-maven-build:
    name: DEV Maven build
    # Never skipped for docs-only merges: PROD can only promote a develop commit DEV has built (E1).
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && inputs.deploy-dev-enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Maven verify (tests + jar)
        # E9: verify, not deploy - nothing consumes the services' Maven artifacts, so they are no
        # longer published to GitHub Packages. Same tests as before; the jar is still in target/.
        run: mvn --batch-mode --update-snapshots verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-app-jar
          path: target/*.jar

  dev-container-build:
    name: DEV container build and push
    # The one and only image build for this develop commit: PROD later promotes this exact image.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && inputs.deploy-dev-enabled
    needs: dev-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dev-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/${{ inputs.app }}
          # dev- prefix: a sandbox push of the same commit (a new feature branch not yet changed
          # from develop) tags <sha> with an expiring image; it must never overwrite the DEV image.
          tags: dev-${{ github.event.pull_request.merge_commit_sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
      - name: Push to Quay
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/${{ inputs.app }}
          tags: dev-${{ github.event.pull_request.merge_commit_sha }}
          username: ${{ inputs.quay-username }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-dev:
    name: Deploy DEV
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && inputs.deploy-dev-enabled
    needs: dev-container-build
    # E4: one DEV deploy at a time per service; a newer merge replaces any deploy still
    # waiting, so the latest merge is the one that ends up running.
    concurrency:
      group: deploy-dev-${{ inputs.app }}
      cancel-in-progress: false
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy by digest
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: dev
          IMAGE_DIGEST: ${{ needs.dev-container-build.outputs.image-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest '$IMAGE_DIGEST'"; exit 1; }
          mkdir -p kubernetes/.deploy
          printf '%s\n' \
            'apiVersion: kustomize.config.k8s.io/v1beta1' \
            'kind: Kustomization' \
            'resources:' \
            "  - ../overlays/$ENV_NAME" \
            'images:' \
            "  - name: quay.io/tvattima/$APP" \
            "    digest: $IMAGE_DIGEST" > kubernetes/.deploy/kustomization.yaml
          kubectl kustomize kubernetes/.deploy | kubectl apply -n "services-$ENV_NAME" -f -
          kubectl rollout status deployment "$APP" -n "services-$ENV_NAME" --timeout=5m
          echo "Deployed quay.io/tvattima/$APP@$IMAGE_DIGEST to services-$ENV_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke check through the ingress
        # E10: the rollout only proves the pod is ready inside the cluster. This checks the service
        # end to end - DNS, Traefik IngressRoute, TLS certificate, default-headers Middleware - by
        # calling /actuator/health/readiness on the host the IngressRoute actually serves. A failure
        # fails the run, which triggers GitHub's failed-workflow notification to whoever pushed/merged.
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          match=$(kubectl get ingressroute "$APP" -n "services-$ENV_NAME" -o jsonpath='{.spec.routes[0].match}')
          host=$(sed -nE 's/.*Host\(`([^`]+)`\).*/\1/p' <<<"$match")
          if [ -z "$host" ]; then
            echo "::error title=Smoke check failed::No Host(...) in IngressRoute $APP (services-$ENV_NAME): '$match'"
            exit 1
          fi
          url="https://$host/actuator/health/readiness"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o readiness.json -w '%{http_code}' --max-time 10 "$url" 2>curl.err || true)
            if [ "$code" = 200 ] && grep -q '"status":"UP"' readiness.json; then
              echo "Smoke check passed on attempt $attempt: $url -> $code $(head -c 200 readiness.json)"
              echo "Smoke check: $url -> $code $(head -c 200 readiness.json)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: $url -> HTTP $code $(head -c 200 readiness.json 2>/dev/null) $(head -c 200 curl.err)"
            sleep 10
          done
          echo "::error title=Smoke check failed::$url did not report UP within 2 minutes (last HTTP $code). The rollout succeeded inside the cluster, so check DNS, the IngressRoute, the TLS certificate and the default-headers Middleware in services-$ENV_NAME."
          echo "**Smoke check FAILED:** $url (last HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  prod-deploy-gate:
    name: PROD deploy gate
    # Runs only when the PROD gate is shut, to explain why the PROD jobs were skipped.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && !inputs.deploy-prod-enabled
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report shut gate
        run: |
          msg="PROD deploy gate is shut (the caller's deploy-prod-enabled input is false; set the DEPLOY_PROD_ENABLED variable to 'true' to open it). PROD promotion and deploy were skipped."
          echo "::notice title=PROD deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  prod-promote:
    name: PROD promote DEV image
    # Build once, promote by digest (HOMELAB-26 E1): no Maven build and no image build for PROD.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && inputs.deploy-prod-enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-digest: ${{ steps.promote.outputs.digest }}
    env:
      APP: ${{ inputs.app }}
      MAIN_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      DEVELOP_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check main has exactly the develop commit's code
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_tree=$(gh api "repos/$REPO/git/commits/$MAIN_SHA" --jq .tree.sha)
          develop_tree=$(gh api "repos/$REPO/git/commits/$DEVELOP_SHA" --jq .tree.sha)
          if [ "$main_tree" != "$develop_tree" ]; then
            echo "::error title=PROD promotion refused::main ($MAIN_SHA, tree $main_tree) does not have the same code as the develop commit $DEVELOP_SHA (tree $develop_tree). main has changes that are not on develop, so no DEV-tested image matches it. Bring those changes into develop, let DEV build them, then merge develop into main again."
            exit 1
          fi
          echo "main $MAIN_SHA has the same tree as develop $DEVELOP_SHA ($main_tree)."
      - name: Promote the DEV image to PROD
        id: promote
        env:
          QUAY_USERNAME: ${{ inputs.quay-username }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          repo="quay.io/tvattima/$APP"
          printf '%s' "$QUAY_TOKEN" | skopeo login quay.io --username "$QUAY_USERNAME" --password-stdin
          if ! skopeo inspect --raw "docker://$repo:dev-$DEVELOP_SHA" > manifest.json; then
            echo "::error title=No DEV image to promote::$repo:dev-$DEVELOP_SHA does not exist. PROD only deploys the image DEV built for the develop commit being released; there is none if the DEV gate was shut when that commit was merged, or if develop's head is not a merge of a feature/* PR. Get that commit built by DEV, then release again."
            exit 1
          fi
          digest="sha256:$(sha256sum manifest.json | cut -d' ' -f1)"
          # Same registry and repository: this only adds the tag prod-<main SHA> to the existing digest.
          skopeo copy --all --preserve-digests "docker://$repo@$digest" "docker://$repo:prod-$MAIN_SHA"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoted $repo:dev-$DEVELOP_SHA ($digest) as $repo:prod-$MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy PROD
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && inputs.deploy-prod-enabled
    needs: prod-promote
    # E4: one PROD deploy at a time per service; a newer merge replaces any deploy still
    # waiting, so the latest merge is the one that ends up running.
    concurrency:
      group: deploy-prod-${{ inputs.app }}
      cancel-in-progress: false
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy by digest
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: prod
          IMAGE_DIGEST: ${{ needs.prod-promote.outputs.image-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid image digest '$IMAGE_DIGEST'"; exit 1; }
          mkdir -p kubernetes/.deploy
          printf '%s\n' \
            'apiVersion: kustomize.config.k8s.io/v1beta1' \
            'kind: Kustomization' \
            'resources:' \
            "  - ../overlays/$ENV_NAME" \
            'images:' \
            "  - name: quay.io/tvattima/$APP" \
            "    digest: $IMAGE_DIGEST" > kubernetes/.deploy/kustomization.yaml
          kubectl kustomize kubernetes/.deploy | kubectl apply -n "services-$ENV_NAME" -f -
          kubectl rollout status deployment "$APP" -n "services-$ENV_NAME" --timeout=5m
          echo "Deployed quay.io/tvattima/$APP@$IMAGE_DIGEST to services-$ENV_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke check through the ingress
        # E10: the rollout only proves the pod is ready inside the cluster. This checks the service
        # end to end - DNS, Traefik IngressRoute, TLS certificate, default-headers Middleware - by
        # calling /actuator/health/readiness on the host the IngressRoute actually serves. A failure
        # fails the run, which triggers GitHub's failed-workflow notification to whoever pushed/merged.
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: prod
        run: |
          set -euo pipefail
          match=$(kubectl get ingressroute "$APP" -n "services-$ENV_NAME" -o jsonpath='{.spec.routes[0].match}')
          host=$(sed -nE 's/.*Host\(`([^`]+)`\).*/\1/p' <<<"$match")
          if [ -z "$host" ]; then
            echo "::error title=Smoke check failed::No Host(...) in IngressRoute $APP (services-$ENV_NAME): '$match'"
            exit 1
          fi
          url="https://$host/actuator/health/readiness"
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o readiness.json -w '%{http_code}' --max-time 10 "$url" 2>curl.err || true)
            if [ "$code" = 200 ] && grep -q '"status":"UP"' readiness.json; then
              echo "Smoke check passed on attempt $attempt: $url -> $code $(head -c 200 readiness.json)"
              echo "Smoke check: $url -> $code $(head -c 200 readiness.json)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: $url -> HTTP $code $(head -c 200 readiness.json 2>/dev/null) $(head -c 200 curl.err)"
            sleep 10
          done
          echo "::error title=Smoke check failed::$url did not report UP within 2 minutes (last HTTP $code). The rollout succeeded inside the cluster, so check DNS, the IngressRoute, the TLS certificate and the default-headers Middleware in services-$ENV_NAME."
          echo "**Smoke check FAILED:** $url (last HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
