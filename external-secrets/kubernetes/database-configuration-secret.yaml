apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-configuration-secret
  namespace: services-sandbox
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-cluster-secret-store-sandbox
    kind: ClusterSecretStore
  target:
    name: database-configuration-secret
    creationPolicy: Owner
  data:
    - secretKey: database-configuration.yml
      remoteRef:
        key: database-configuration.yml