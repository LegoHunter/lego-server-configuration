# Copies every secret in Infisical's Sandbox environment into one Secret,
# services-sandbox/services-sandbox-external-secret (the Secret takes the ExternalSecret's name).
# The SANDBOX services mount it at /etc/.credentials. DEV and PROD follow the same pattern:
# services-<env>-external-secret in services-<env>, reading infisical-<env>-cluster-secret-store.
#
# deletionPolicy Retain: if a sync fails (for example the store cannot authenticate), the existing
# Secret is kept as it is, so running pods are not affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: services-sandbox-external-secret
  namespace: services-sandbox
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-sandbox-cluster-secret-store
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - find:
        name:
          regexp: .*
