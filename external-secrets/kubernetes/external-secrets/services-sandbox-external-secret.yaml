# Copies the SANDBOX application configuration files from Infisical's Sandbox environment into one
# Secret, services-sandbox/services-sandbox-external-secret (the Secret takes the ExternalSecret's
# name). The SANDBOX services mount it at /etc/.credentials.
#
# Only secrets whose names end in .yml are copied (HOMELAB-60), as in DEV and PROD: the
# *-configuration.yml files the services import. Infisical Sandbox also holds credentials the
# services must never see, e.g. silo-dev-ingress-sandbox (read by silo-dev itself) and, until it is
# deleted, the unused redpanda-dev-users (Redpanda admin password). Their names have no .yml suffix,
# so they stay out. Until 2026-11-09 this copied every Sandbox secret (regexp .*).
#
# deletionPolicy Retain: if a sync fails (for example the store cannot authenticate), the existing
# Secret is kept as it is, so running pods are not affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: services-sandbox-external-secret
  namespace: services-sandbox
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-sandbox-cluster-secret-store
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - find:
        name:
          regexp: \.yml$
