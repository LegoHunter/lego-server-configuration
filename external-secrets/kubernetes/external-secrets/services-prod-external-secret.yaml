# Copies the PROD application configuration files from Infisical's Production environment into one
# Secret, services-prod/services-prod-external-secret (the Secret takes the ExternalSecret's name).
# The PROD services mount it at /etc/.credentials, the same way SANDBOX does (HOMELAB-28).
#
# The one difference from SANDBOX: only secrets whose names end in .yml are copied (the
# *-configuration.yml files the services import). Infisical Production also holds infrastructure
# credentials that the services must never see: redpanda-prod-users (including the Redpanda admin
# password), silo-prod-root (the Silo root login) and silo-prod-ingress. Their names have no .yml
# suffix, so they stay out (owner decision, 2026-11-07).
#
# deletionPolicy Retain: if a sync fails (for example the store cannot authenticate), the existing
# Secret is kept as it is, so running pods are not affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: services-prod-external-secret
  namespace: services-prod
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - find:
        name:
          regexp: \.yml$
