# Copies the DEV application configuration files from Infisical's Development environment into one
# Secret, services-dev/services-dev-external-secret (the Secret takes the ExternalSecret's name).
# The DEV services (lego-data-service, lego-data-ingress) mount it at /etc/.credentials (HOMELAB-57).
#
# Same as PROD (owner decision: DEV matches PROD): only secrets whose names end in .yml are copied,
# the *-configuration.yml files the services import. Infisical Development also holds
# infrastructure credentials the services must never see: redpanda-dev-users (incl. the Redpanda
# admin password), silo-dev-root (the Silo root login) and silo-dev-ingress-dev. Their names have no
# .yml suffix, so they stay out.
#
# deletionPolicy Retain: if a sync fails (for example the store cannot authenticate), the existing
# Secret is kept as it is, so running pods are not affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: services-dev-external-secret
  namespace: services-dev
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-dev-cluster-secret-store
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - find:
        name:
          regexp: \.yml$
