# Reads the Global environment of the Infisical project "legohunter.io" (HOMELAB-76).
#
# Global holds secrets that belong to an account, not to an environment, so SANDBOX, DEV and PROD all
# read the same copy: one BrickLink seller account (bricklink-client-api-keys.yml: one consumer key and
# secret, one IP-bound token, since every environment calls BrickLink from the same home IP), and the
# mailbox that receives BrickLink's MFA codes. Everything else stays per environment.
#
# Auth: the read-only Infisical service token "LegoHunter-IO Global" (scope: Global, path /), stored in
# the Secret external-secrets/infisical-global-token (key "token"), which the owner creates by hand
# (see README.md). It can read only Global; the Sandbox, Development and Production tokens cannot read it.
#
# environmentSlug: confirm Global's slug in Infisical before applying (Project Settings -> Environments).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-global-cluster-secret-store
spec:
  provider:
    infisical:
      hostAPI: "http://infisical-infisical.infisical.svc.cluster.local:8080"
      auth:
        tokenAuthCredentials:
          accessToken:
            name: infisical-global-token
            key: token
            namespace: external-secrets
      secretsScope:
        projectSlug: "legohunter-io-g-ua3"
        environmentSlug: "global"
        secretsPath: "/"
        recursive: true
        expandSecretReferences: true
