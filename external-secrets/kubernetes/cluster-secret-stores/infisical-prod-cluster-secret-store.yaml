# Reads the Production environment of the Infisical project "legohunter.io".
#
# Auth: the read-only Infisical service token "LegoHunter-IO Production" (scope: Production,
# path /), stored in the Secret external-secrets/infisical-prod-token (key "token"), which the owner
# creates by hand (see README.md). That token can read only Production, and the Sandbox and
# Development tokens cannot read Production.
#
# environmentSlug: confirm Production's slug in Infisical before applying (Project Settings ->
# Environments, or the last part of the Production secrets URL).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-prod-cluster-secret-store
spec:
  provider:
    infisical:
      hostAPI: "http://infisical-infisical.infisical.svc.cluster.local:8080"
      auth:
        tokenAuthCredentials:
          accessToken:
            name: infisical-prod-token
            key: token
            namespace: external-secrets
      secretsScope:
        projectSlug: "legohunter-io-g-ua3"
        environmentSlug: "prod"
        secretsPath: "/"
        recursive: true
        expandSecretReferences: true
