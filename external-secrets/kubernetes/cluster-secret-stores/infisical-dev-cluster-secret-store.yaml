# Reads the Development environment of the Infisical project "legohunter.io".
#
# Auth: the read-only Infisical service token "LegoHunter-IO Development" (scope: Development,
# path /), stored in the Secret external-secrets/infisical-dev-token (key "token"), which the owner
# creates by hand (see README.md).
#
# Until HOMELAB-47 this store used the Sandbox token (infisical-api-token), so it actually read
# SANDBOX: the Infisical secret redpanda-dev-users lived in Sandbox. Before applying this version,
# copy redpanda-dev-users into the Development environment.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-dev-cluster-secret-store
spec:
  provider:
    infisical:
      hostAPI: "http://infisical-infisical.infisical.svc.cluster.local:8080"
      auth:
        tokenAuthCredentials:
          accessToken:
            name: infisical-dev-token
            key: token
            namespace: external-secrets
      secretsScope:
        projectSlug: "legohunter-io-g-ua3"
        environmentSlug: "dev"
        secretsPath: "/"
        recursive: true
        expandSecretReferences: true
