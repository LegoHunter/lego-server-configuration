# Reads the Sandbox environment of the Infisical project "legohunter.io" (organization LegoHunter-IO).
#
# Auth: the read-only Infisical service token "LegoHunter-IO Sandbox" (scope: Sandbox, path /,
# recursive), stored in the Secret external-secrets/infisical-api-token (key "token"). The owner
# creates that Secret by hand (see README.md); no credential is stored in this repository.
#
# Each environment has its own service token, so this store cannot read Development or Production.
# Infisical's free plan has no custom roles, so per-environment machine identities are not possible
# (HOMELAB-47).
#
# A service token is tied to its project, so Infisical ignores projectSlug. The value deployed until
# 2026-11 (4fc60742-...) matched nothing and still worked; this is the project's real slug.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-sandbox-cluster-secret-store
spec:
  provider:
    infisical:
      hostAPI: "http://infisical-infisical.infisical.svc.cluster.local:8080"
      auth:
        tokenAuthCredentials:
          accessToken:
            name: infisical-api-token
            key: token
            namespace: external-secrets
      secretsScope:
        projectSlug: "legohunter-io-g-ua3"
        environmentSlug: "sandbox"
        secretsPath: "/"
        recursive: true
        expandSecretReferences: true
