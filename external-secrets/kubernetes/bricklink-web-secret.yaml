apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bricklink-web-secret
  namespace: services-sandbox
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-cluster-secret-store-sandbox
    kind: ClusterSecretStore
  target:
    name: bricklink-web-secret
    creationPolicy: Owner
  data:
    - secretKey: bricklink-web.yml
      remoteRef:
        key: bricklink-web.yml