apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redpanda-users
  namespace: redpanda-dev

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: infisical-dev-cluster-secret-store
    kind: ClusterSecretStore

  target:
    name: redpanda-users
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: admin_password
      remoteRef:
        key: redpanda-dev-users
        property: admin_password

    - secretKey: devproducer_password
      remoteRef:
        key: redpanda-dev-users
        property: devproducer_password

    - secretKey: devconsumer_password
      remoteRef:
        key: redpanda-dev-users
        property: devconsumer_password

