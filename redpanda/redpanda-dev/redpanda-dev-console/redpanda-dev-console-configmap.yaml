apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-dev-console-config
  namespace: redpanda-dev
data:
  # https://docs.redpanda.com/current/console/config/configure-console/
  config.yaml: |
    kafka:
      brokers:
        - redpanda-dev-0.redpanda-dev.redpanda-dev.svc.cluster.local:9092
        - redpanda-dev-1.redpanda-dev.redpanda-dev.svc.cluster.local:9092
        - redpanda-dev-2.redpanda-dev.redpanda-dev.svc.cluster.local:9092

      tls:
        enabled: false
        insecureSkipTlsVerify: true

      sasl:
        enabled: true
        mechanism: SCRAM-SHA-512
        username: admin
        password: <REMOVED - see README>

    server:
      listenAddress: "0.0.0.0"
      listenPort: 8080
