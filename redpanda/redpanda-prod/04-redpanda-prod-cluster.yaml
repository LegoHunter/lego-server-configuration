# redpanda-prod: the dedicated PROD Redpanda cluster (HOMELAB-47).
#
# Based on redpanda-dev (../redpanda-dev/redpanda-dev-cluster.yaml), which matches the live dev CR.
# The differences from dev are listed below.
#
#   Brokers    3, at most one per node (the chart's default hard anti-affinity), on rasppi5-05,
#              -06 and -10 only, so no node also runs a dev broker (07, 08, 09).
#   Disk       100Gi per broker on topolvm (dev: 20Gi). The volumes can be grown later.
#   Retention  30 days cluster-wide (dev: Redpanda's 7-day default), replication factor 3.
#   External   prod.internal.legohunter.io, from MetalLB pool redpanda-prod-ip-pool
#              (10.0.2.110-112). There is no external-dns annotation: DNS records are added by
#              hand in Technitium.
#   SASL       superusers come from redpanda-prod-superusers, which ExternalSecrets builds from
#              Infisical Production.
#   Image      pinned to v26.1.6, the version dev runs (operator v26.1.3).
#
# CRD reference:
# https://docs.redpanda.com/current/reference/k-crd/#k8s-api-github-com-redpanda-data-redpanda-operator-operator-api-redpanda-v1alpha2-redpandaclusterspec
apiVersion: cluster.redpanda.com/v1alpha2
kind: Redpanda
metadata:
  name: redpanda-prod
  namespace: redpanda-prod

spec:
  clusterSpec:
    commonLabels:
      environment: prod

    image:
      tag: v26.1.6

    statefulset:
      replicas: 3
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - rasppi5-05
                          - rasppi5-06
                          - rasppi5-10

    storage:
      persistentVolume:
        enabled: true
        size: 100Gi
        storageClass: topolvm-provisioner

    resources:
      requests:
        cpu: "1"
        memory: "2Gi"

    config:
      cluster:
        log_retention_ms: 2592000000     # 30 days
        default_topic_replications: 3

    listeners:
      kafka:
        port: 9092
        tls:
          enabled: false

        external:
          default:
            advertisedPorts:
              - 31092
            enabled: true
            tls:
              enabled: true
              requireClientAuth: false

      http:
        external:
          default:
            advertisedPorts:
              - 30082
            enabled: true

      admin:
        external:
          default:
            advertisedPorts:
              - 31644
            enabled: true
        tls:
          enabled: true
          requireClientAuth: false

      rpc:
        port: 33145

    auth:
      sasl:
        enabled: true
        mechanism: SCRAM-SHA-512
        secretRef: redpanda-prod-superusers

    tls:
      certs:
        external:
          caEnabled: false
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-production
      enabled: true

    external:
      enabled: true
      domain: prod.internal.legohunter.io
      type: LoadBalancer
      annotations:
        metallb.universe.tf/address-pool: redpanda-prod-ip-pool

    console:
      enabled: false
