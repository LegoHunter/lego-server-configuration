# Redpanda PROD credentials, read from Infisical's Production environment through
# infisical-prod-cluster-secret-store (its own read-only service token).
#
# The Infisical secret "redpanda-prod-users" (Production, path /) holds a JSON object:
#   {"admin_password": "...", "prodproducer_password": "...", "prodconsumer_password": "..."}
# This is the same shape as redpanda-dev-users in Development; the passwords are new, not reused.
#
# Nothing here is created by hand: dev's superusers Secret came from a superusers.txt file on
# rasppi5-01, while PROD's is built from admin_password below.

# redpanda-users: the passwords for the console (admin) and for the users-and-topics script
# (prodproducer, prodconsumer).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redpanda-users
  namespace: redpanda-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: redpanda-users
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin_password
      remoteRef:
        key: redpanda-prod-users
        property: admin_password
    - secretKey: prodproducer_password
      remoteRef:
        key: redpanda-prod-users
        property: prodproducer_password
    - secretKey: prodconsumer_password
      remoteRef:
        key: redpanda-prod-users
        property: prodconsumer_password
---
# redpanda-prod-superusers: the cluster's SASL superuser list, which the Redpanda CR references
# through auth.sasl.secretRef. The format is one "user:password:mechanism" line per superuser.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redpanda-prod-superusers
  namespace: redpanda-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-prod-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: redpanda-prod-superusers
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        superusers.txt: "admin:{{ .admin_password }}:SCRAM-SHA-512"
  data:
    - secretKey: admin_password
      remoteRef:
        key: redpanda-prod-users
        property: admin_password
