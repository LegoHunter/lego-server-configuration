# infisical-loadbalancer.yaml
apiVersion: v1
kind: Service
metadata:
  name: infisical-lb
  namespace: infisical
  annotations:
    metallb.universe.tf/address-pool: first-pool
spec:
  type: LoadBalancer
  # loadBalancerIP: 10.0.2.86
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: traefik